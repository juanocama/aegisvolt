services:
  floci:
    image: floci/floci:latest
    ports: ["4566:4566"]
  station-reservation:
    build:
      context: .
      dockerfile: services/station-reservation/Dockerfile
    environment:
      ENVIRONMENT: dev
      AWS_ENDPOINT_URL: http://floci:4566
      AWS_DEFAULT_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      TABLE_NAME: aegisvolt-dev-stations
    ports: ["8001:8001"]
    depends_on: [floci]
  billing-wallet:
    build:
      context: .
      dockerfile: services/billing-wallet/Dockerfile
    environment:
      ENVIRONMENT: dev
      AWS_ENDPOINT_URL: http://floci:4566
      AWS_DEFAULT_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      TABLE_NAME: aegisvolt-dev-wallets
    ports: ["8002:8002"]
    depends_on: [floci]
  energy-dispatch:
    build:
      context: .
      dockerfile: services/energy-dispatch/Dockerfile
    environment:
      ENVIRONMENT: dev
      AWS_ENDPOINT_URL: http://floci:4566
      AWS_DEFAULT_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      TABLE_NAME: aegisvolt-dev-dispatch
    ports: ["8003:8003"]
    depends_on: [floci]
  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    environment:
      ENVIRONMENT: dev
      STATION_URL: http://station-reservation:8001
      BILLING_URL: http://billing-wallet:8002
      DISPATCH_URL: http://energy-dispatch:8003
      ENABLE_DYNAMIC_SURGE_PRICING: ${ENABLE_DYNAMIC_SURGE_PRICING:-false}
      ENABLE_FAST_CHARGE_BOOST: ${ENABLE_FAST_CHARGE_BOOST:-false}
      SIMULATE_CHARGER_HARDWARE_FAULT: ${SIMULATE_CHARGER_HARDWARE_FAULT:-false}
      AWS_ENDPOINT_URL: http://floci:4566
      AWS_DEFAULT_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      SAGA_TABLE: aegisvolt-dev-sagas
    ports: ["8010:8000"]
    depends_on: [station-reservation, billing-wallet, energy-dispatch]
