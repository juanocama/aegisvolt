name: Continuous integration

# Pre-merge gate (spec 3.1c / 3.3): every PR into dev, test or prod must pass
# promotion-guard, lint-build, unit-tests, integration-tests, e2e-tests,
# kubernetes, terraform-static and terraform-plan before merging (these job
# names are the required status checks in the branch protection rules).

on:
  pull_request:
    branches: [dev, test, prod]
  push:
    branches: [dev, test, prod]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  promotion-guard:
    name: promotion-guard
    runs-on: ubuntu-latest
    steps:
      - name: Enforce feature/* -> dev -> test -> prod
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          if [[ "$EVENT" != "pull_request" ]]; then echo "push to protected branch (post-merge)"; exit 0; fi
          case "$BASE" in
            dev)  [[ "$HEAD" =~ ^(feature|fix|hotfix|chore|docs)/ ]] || { echo "PRs into dev must come from feature/* (got $HEAD)" >&2; exit 1; } ;;
            test) [[ "$HEAD" == "dev" ]]  || { echo "Only dev can be promoted into test (got $HEAD)" >&2; exit 1; } ;;
            prod) [[ "$HEAD" == "test" ]] || { echo "Only test can be promoted into prod (got $HEAD)" >&2; exit 1; } ;;
            *) echo "Unexpected base branch $BASE" >&2; exit 1 ;;
          esac
          echo "Promotion $HEAD -> $BASE allowed"

  lint-build:
    name: lint-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install -r requirements.txt
      - name: Python syntax
        run: python -m compileall -q common gateway services tests e2e scripts observability/prefect
      - name: GraphQL schema matches reviewed SDL
        run: python -m pytest -q tests/test_graphql_schema.py
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.15.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend lint, unit tests and build
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm test
          npm run build
      - name: Build all Docker images (no push)
        shell: bash
        run: |
          set -euo pipefail
          docker build -f gateway/Dockerfile -t aegisvolt-gateway:ci .
          for s in station-reservation billing-wallet energy-dispatch; do
            docker build -f "services/$s/Dockerfile" -t "aegisvolt-$s:ci" .
          done
          docker build -t aegisvolt-frontend:ci frontend
      - name: Frontend container fails closed without a GraphQL upstream
        shell: bash
        run: |
          if docker run --rm --read-only --tmpfs /tmp:mode=1777 --tmpfs /etc/nginx/conf.d:mode=1777 aegisvolt-frontend:ci; then
            echo "frontend started without GRAPHQL_UPSTREAM_HOST" >&2; exit 1
          fi

  unit-tests:
    name: unit-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install -r requirements.txt
      - name: Business logic, feature flags, canary gate, observability
        run: >-
          python -m pytest -q
          tests/test_feature_flags.py tests/test_canary_gate.py
          tests/test_phase4_observability.py tests/test_phase4_canary_readiness.py

  integration-tests:
    name: integration-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install -r requirements.txt
      - name: GraphQL + three services + DynamoDB (Moto), SAGA and compensations
        run: python -m pytest -q tests/test_services.py tests/test_saga.py tests/test_compensation.py

  e2e-tests:
    name: e2e-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install -r requirements.txt
      - name: Start full stack (Floci DynamoDB, 3 services, gateway, frontend)
        run: docker compose up -d --build
      - name: Wait for gateway and frontend
        shell: bash
        run: |
          for i in $(seq 1 60); do
            curl -fsS -X POST -H 'Content-Type: application/json' -d '{"query":"{ dashboard { servicesOk } }"}' http://localhost:8010/graphql >/dev/null \
              && curl -fsS http://localhost:8088/healthz >/dev/null && exit 0
            sleep 5
          done
          docker compose ps; exit 1
      - name: End-to-end through API and frontend
        env:
          E2E_GRAPHQL_URL: http://localhost:8010/graphql
          E2E_FRONTEND_URL: http://localhost:8088
          AWS_ENDPOINT_URL: http://localhost:4566
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          AWS_DEFAULT_REGION: us-east-1
        run: python -m pytest -q e2e
      - name: Stack logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=200
      - name: Stop stack
        if: always()
        run: docker compose down -v

  terraform:
    name: terraform-static
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: "1.10.5"
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate

  terraform-plan:
    name: terraform-plan
    if: github.event_name == 'pull_request'
    needs: [promotion-guard, terraform]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: infra
    env:
      TARGET_ENVIRONMENT: ${{ github.base_ref }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Fail closed without the plan role
        shell: bash
        env:
          ROLE_ARN: ${{ vars.TERRAFORM_PLAN_ROLE_ARN }}
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: |
          set -euo pipefail
          [[ "$TARGET_ENVIRONMENT" =~ ^(dev|test|prod)$ ]] || { echo "Unexpected target $TARGET_ENVIRONMENT" >&2; exit 1; }
          [[ "$ROLE_ARN" == arn:aws:iam::*:role/* ]] || { echo "Repository variable TERRAFORM_PLAN_ROLE_ARN is not configured." >&2; exit 1; }
          [[ -n "$AWS_REGION" ]] || { echo "Repository variable AWS_REGION is not configured." >&2; exit 1; }
          if grep -q CHANGE_ME "envs/${TARGET_ENVIRONMENT}.tfvars" "backend/${TARGET_ENVIRONMENT}.hcl"; then
            echo "Placeholder values remain for ${TARGET_ENVIRONMENT}." >&2; exit 1
          fi
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: "1.10.5"
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ vars.TERRAFORM_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Init backend and select the target branch workspace
        run: |
          terraform init -input=false -backend-config="backend/${TARGET_ENVIRONMENT}.hcl"
          terraform workspace select "${TARGET_ENVIRONMENT}"
          terraform workspace show
      - name: terraform plan (read-only, no lock)
        shell: bash
        run: |
          set -euo pipefail
          terraform plan -input=false -lock=false -no-color \
            -var-file="envs/${TARGET_ENVIRONMENT}.tfvars" | tee plan.txt
          {
            echo "### terraform plan for workspace ${TARGET_ENVIRONMENT}"
            grep -E '^(Plan:|No changes)' plan.txt || true
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: terraform-plan-${{ github.base_ref }}
          path: infra/plan.txt
          retention-days: 14

  kubernetes:
    name: Render Kubernetes base
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: python -m pip install PyYAML==6.0.2
      - uses: azure/setup-kubectl@3e0aec4d80787158d308d7b364cb1b702e7feb7f # v4.0.0
        with:
          version: "v1.37.0"
      - name: Render Kustomize resources
        shell: bash
        run: |
          kubectl kustomize k8s > "$RUNNER_TEMP/aegisvolt-rendered.yaml"
          test -s "$RUNNER_TEMP/aegisvolt-rendered.yaml"
          grep -F 'kind: ServiceAccount' "$RUNNER_TEMP/aegisvolt-rendered.yaml"
          grep -F 'kind: Deployment' "$RUNNER_TEMP/aegisvolt-rendered.yaml"
          grep -F 'name: gateway' "$RUNNER_TEMP/aegisvolt-rendered.yaml"
          grep -F 'name: station-reservation' "$RUNNER_TEMP/aegisvolt-rendered.yaml"
          grep -F 'name: billing-wallet' "$RUNNER_TEMP/aegisvolt-rendered.yaml"
          grep -F 'name: energy-dispatch' "$RUNNER_TEMP/aegisvolt-rendered.yaml"
      - name: Validate workload references and selectors
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml

          resources = []
          for path in sorted(Path("k8s").glob("*.yaml")):
              resources.extend(item for item in yaml.safe_load_all(path.read_text()) if item)

          by_kind_name = {(item.get("kind"), item.get("metadata", {}).get("name")): item for item in resources}
          deployments = [item for item in resources if item.get("kind") == "Deployment"]
          services = [item for item in resources if item.get("kind") == "Service"]
          service_accounts = {name for kind, name in by_kind_name if kind == "ServiceAccount"}
          config_maps = {name: item.get("data", {}) for (kind, name), item in by_kind_name.items() if kind == "ConfigMap"}

          expected = {"gateway", "gateway-canary", "station-reservation", "billing-wallet", "energy-dispatch", "frontend"}
          assert {item["metadata"]["name"] for item in deployments} == expected
          assert {item["metadata"]["name"] for item in services} == expected
          for deployment in deployments:
              spec = deployment["spec"]
              selector = spec["selector"]["matchLabels"]
              labels = spec["template"]["metadata"]["labels"]
              assert all(labels.get(key) == value for key, value in selector.items()), deployment["metadata"]["name"]
              pod = spec["template"]["spec"]
              if deployment["metadata"]["name"] == "frontend":
                  assert pod.get("automountServiceAccountToken") is False and "serviceAccountName" not in pod
              else:
                  assert pod["serviceAccountName"] in service_accounts, deployment["metadata"]["name"]
              for container in pod["containers"]:
                  image = container["image"]
                  assert image and ":" in image.rsplit("/", 1)[-1], deployment["metadata"]["name"]
                  for env_from in container.get("envFrom", []):
                      assert env_from["configMapRef"]["name"] in config_maps
                  for env in container.get("env", []):
                      reference = env.get("valueFrom", {}).get("configMapKeyRef")
                      if reference:
                          assert reference["key"] in config_maps[reference["name"]]
          for service in services:
              selector = service["spec"]["selector"]
              assert any(all(deployment["spec"]["template"]["metadata"]["labels"].get(k) == v for k, v in selector.items()) for deployment in deployments), service["metadata"]["name"]
          for ingress in (item for item in resources if item.get("kind") == "Ingress"):
              for rule in ingress.get("spec", {}).get("rules", []):
                  for route in rule.get("http", {}).get("paths", []):
                      backend = route["backend"]["service"]
                      if backend.get("port", {}).get("name") == "use-annotation":
                          import json
                          action = json.loads(ingress["metadata"]["annotations"][f"alb.ingress.kubernetes.io/actions.{backend['name']}"])
                          targets = {group["serviceName"] for group in action["forwardConfig"]["targetGroups"]}
                          assert targets <= {service["metadata"]["name"] for service in services}, targets
                      else:
                          assert backend["name"] in {service["metadata"]["name"] for service in services}
          for name in ("gateway", "station-reservation", "billing-wallet", "energy-dispatch", "frontend"):
              assert f"aegisvolt/dev/{name}" in Path("k8s/kustomization.yaml").read_text()
          print(f"Validated {len(resources)} Kubernetes resources, workload references, and service selectors.")
          PY

      - name: Render environment overlays
        shell: bash
        run: |
          set -euo pipefail
          # These repository-controlled overlays reference only the checked-in k8s root YAML files.
          # Keep the relaxed loader scoped to these paths; do not accept external manifest inputs.
          for environment in dev test prod; do
            kubectl kustomize --load-restrictor LoadRestrictionsNone "k8s/overlays/${environment}" \
              > "$RUNNER_TEMP/aegisvolt-${environment}-rendered.yaml"
            test -s "$RUNNER_TEMP/aegisvolt-${environment}-rendered.yaml"
          done
          python - <<'PY'
          import os
          from pathlib import Path
          import yaml

          rendered_dir = Path(os.environ["RUNNER_TEMP"])
          workloads = {"gateway", "station-reservation", "billing-wallet", "energy-dispatch"}
          for environment in ("dev", "test", "prod"):
              path = rendered_dir / f"aegisvolt-{environment}-rendered.yaml"
              resources = [item for item in yaml.safe_load_all(path.read_text()) if item]
              keyed = {(item["kind"], item["metadata"]["name"]): item for item in resources}
              deployments = {name: keyed[("Deployment", name)] for name in workloads}
              services = {name: keyed[("Service", name)] for name in workloads}
              config = keyed[("ConfigMap", "aegisvolt-config")]["data"]

              assert {kind for kind, _ in keyed} >= {"Namespace", "ServiceAccount", "ConfigMap", "Service", "Deployment"}
              assert len(resources) == len(keyed), f"duplicate resources in {environment} overlay"
              assert keyed[("Namespace", "aegisvolt")]["metadata"]["labels"]["environment"] == environment
              assert config["ENVIRONMENT"] == environment
              assert config["SAGA_TABLE"] == f"aegisvolt-{environment}-sagas"
              assert config["FLAGS_TABLE"] == f"aegisvolt-{environment}-flags"
              assert keyed[("Ingress", "gateway-private")]["metadata"]["annotations"]["alb.ingress.kubernetes.io/load-balancer-name"] == f"{environment}-aegisvolt-graphql"
              assert keyed[("ConfigMap", "frontend-config")]["data"]["GRAPHQL_UPSTREAM_PATH"] == f"/{environment}/graphql"
              for resource in resources:
                  assert resource["metadata"].get("namespace", "aegisvolt") == "aegisvolt"
                  assert resource["metadata"].get("labels", {}).get("environment") == environment, resource["metadata"]["name"]

              expected_replicas = 1 if environment == "dev" else 2
              for name, deployment in deployments.items():
                  spec = deployment["spec"]
                  assert spec["replicas"] == expected_replicas, (environment, name)
                  pod = spec["template"]
                  assert pod["metadata"]["labels"]["environment"] == environment
                  container = pod["spec"]["containers"][0]
                  assert f"/aegisvolt/{environment}/{name}:CHANGE_ME_SHA" in container["image"]
                  assert container["resources"].get("requests") and container["resources"].get("limits")
                  assert container.get("startupProbe") and container.get("livenessProbe") and container.get("readinessProbe")
                  if name != "gateway":
                      values = {entry["name"]: entry.get("value") for entry in container["env"]}
                      assert values["TABLE_NAME"] == f"aegisvolt-{environment}-" + {
                          "station-reservation": "stations",
                          "billing-wallet": "wallets",
                          "energy-dispatch": "dispatch",
                      }[name]
                  assert services[name]["spec"]["type"] == "ClusterIP"
              print(f"Validated {environment} overlay: {len(resources)} objects, environment tables, images, probes, resources, and replicas.")
          PY

      - name: Validate Kubernetes schemas
        shell: bash
        run: |
          set -euo pipefail
          kubectl kustomize k8s > "$RUNNER_TEMP/aegisvolt-root-rendered.yaml"
          for environment in dev test prod; do
            kubectl kustomize --load-restrictor LoadRestrictionsNone "k8s/overlays/${environment}" \
              > "$RUNNER_TEMP/aegisvolt-${environment}-schema.yaml"
          done
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/work:ro" \
            -v "$RUNNER_TEMP:/rendered:ro" \
            -w /work \
            ghcr.io/yannh/kubeconform:v0.8.0-alpine@sha256:6b90a5f23d846140ce0194fe050b1995e546eba938f3a6bf10c039dd5e24588f \
            -strict -summary -kubernetes-version 1.37.0 \
            -schema-location 'https://raw.githubusercontent.com/yannh/kubernetes-json-schema/0c4dd99d9873f7b4c2da24c008476f5841adbe2d/v1.37.0-standalone-strict/{{.ResourceKind}}{{.KindSuffix}}.json' \
            /rendered/aegisvolt-root-rendered.yaml \
            /rendered/aegisvolt-dev-schema.yaml \
            /rendered/aegisvolt-test-schema.yaml \
            /rendered/aegisvolt-prod-schema.yaml

