name: Continuous integration

on:
  pull_request:
    branches: [dev, test, prod]
  push:
    branches: [dev, test, prod]

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests and syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q common gateway services tests
      - run: python -m pytest -q

  frontend:
    name: Frontend lint, tests, and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.15.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  terraform:
    name: Terraform static validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: "1.10.5"
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate

  kubernetes:
    name: Render Kubernetes base
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: python -m pip install PyYAML==6.0.2
      - uses: azure/setup-kubectl@3e0aec4d80787158d308d7b364cb1b702e7feb7f # v4.0.0
        with:
          version: "v1.32.0"
      - name: Render Kustomize resources
        shell: bash
        run: |
          kubectl kustomize k8s > "$RUNNER_TEMP/aegisvolt-rendered.yaml"
          test -s "$RUNNER_TEMP/aegisvolt-rendered.yaml"
          grep -F 'kind: ServiceAccount' "$RUNNER_TEMP/aegisvolt-rendered.yaml"
          grep -F 'kind: Deployment' "$RUNNER_TEMP/aegisvolt-rendered.yaml"
          grep -F 'name: gateway' "$RUNNER_TEMP/aegisvolt-rendered.yaml"
          grep -F 'name: station-reservation' "$RUNNER_TEMP/aegisvolt-rendered.yaml"
          grep -F 'name: billing-wallet' "$RUNNER_TEMP/aegisvolt-rendered.yaml"
          grep -F 'name: energy-dispatch' "$RUNNER_TEMP/aegisvolt-rendered.yaml"
      - name: Validate workload references and selectors
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml

          resources = []
          for path in sorted(Path("k8s").glob("*.yaml")):
              resources.extend(item for item in yaml.safe_load_all(path.read_text()) if item)

          by_kind_name = {(item.get("kind"), item.get("metadata", {}).get("name")): item for item in resources}
          deployments = [item for item in resources if item.get("kind") == "Deployment"]
          services = [item for item in resources if item.get("kind") == "Service"]
          service_accounts = {name for kind, name in by_kind_name if kind == "ServiceAccount"}
          config_maps = {name: item.get("data", {}) for (kind, name), item in by_kind_name.items() if kind == "ConfigMap"}

          assert {item["metadata"]["name"] for item in deployments} == {"gateway", "station-reservation", "billing-wallet", "energy-dispatch"}
          assert {item["metadata"]["name"] for item in services} == {"gateway", "station-reservation", "billing-wallet", "energy-dispatch"}
          for deployment in deployments:
              spec = deployment["spec"]
              selector = spec["selector"]["matchLabels"]
              labels = spec["template"]["metadata"]["labels"]
              assert all(labels.get(key) == value for key, value in selector.items()), deployment["metadata"]["name"]
              pod = spec["template"]["spec"]
              assert pod["serviceAccountName"] in service_accounts, deployment["metadata"]["name"]
              for container in pod["containers"]:
                  image = container["image"]
                  assert image and ":" in image.rsplit("/", 1)[-1], deployment["metadata"]["name"]
                  for env_from in container.get("envFrom", []):
                      assert env_from["configMapRef"]["name"] in config_maps
                  for env in container.get("env", []):
                      reference = env.get("valueFrom", {}).get("configMapKeyRef")
                      if reference:
                          assert reference["key"] in config_maps[reference["name"]]
          for service in services:
              selector = service["spec"]["selector"]
              assert any(all(deployment["spec"]["template"]["metadata"]["labels"].get(k) == v for k, v in selector.items()) for deployment in deployments), service["metadata"]["name"]
          for ingress in (item for item in resources if item.get("kind") == "Ingress"):
              for rule in ingress.get("spec", {}).get("rules", []):
                  for route in rule.get("http", {}).get("paths", []):
                      assert route["backend"]["service"]["name"] in {service["metadata"]["name"] for service in services}
          for name in ("gateway", "station-reservation", "billing-wallet", "energy-dispatch"):
              assert f"aegisvolt/dev/{name}" in Path("k8s/kustomization.yaml").read_text()
          print(f"Validated {len(resources)} Kubernetes resources, workload references, and service selectors.")
          PY

  docker-images:
    name: Build ${{ matrix.image }} (no push)
    needs: [backend, frontend, terraform, kubernetes]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: gateway
            dockerfile: gateway/Dockerfile
          - image: station-reservation
            dockerfile: services/station-reservation/Dockerfile
          - image: billing-wallet
            dockerfile: services/billing-wallet/Dockerfile
          - image: energy-dispatch
            dockerfile: services/energy-dispatch/Dockerfile
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          tags: aegisvolt/${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
