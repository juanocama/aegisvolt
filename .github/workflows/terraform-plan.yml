name: Protected Terraform remote plan

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment whose remote state and infrastructure are read
        required: true
        type: choice
        options: [dev, test, prod]

permissions:
  contents: read

jobs:
  remote-plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    environment:
      name: terraform-plan-${{ inputs.environment }}
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Fail closed until real backend and region values are configured
        shell: bash
        env:
          TARGET_ENVIRONMENT: ${{ inputs.environment }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          ROLE_ARN: ${{ vars.TERRAFORM_PLAN_ROLE_ARN }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" == "$TARGET_ENVIRONMENT" ]] || { echo 'Dispatch this plan from the matching environment branch.' >&2; exit 1; }
          grep -q 'CHANGE_ME' "backend/${TARGET_ENVIRONMENT}.hcl" && { echo 'Backend config still contains CHANGE_ME; remote plan is disabled.' >&2; exit 1; }
          grep -q 'CHANGE_ME' "envs/${TARGET_ENVIRONMENT}.tfvars" && { echo 'Environment tfvars still contain CHANGE_ME; remote plan is disabled.' >&2; exit 1; }
          grep -qE '^[[:space:]]*bucket[[:space:]]*=.*CHANGE_ME|^[[:space:]]*region[[:space:]]*=.*CHANGE_ME' "backend/${TARGET_ENVIRONMENT}.hcl" && { echo 'Backend bucket or region placeholder remains configured; remote plan is disabled.' >&2; exit 1; }
          [[ -n "$AWS_REGION" && "$AWS_REGION" != CHANGE_ME* ]] || { echo 'AWS_REGION is not configured.' >&2; exit 1; }
          [[ "$ROLE_ARN" == arn:aws:iam::*:role/* ]] || { echo 'TERRAFORM_PLAN_ROLE_ARN is not configured.' >&2; exit 1; }
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: "1.10.5"
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ vars.TERRAFORM_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Initialize explicit environment backend
        run: terraform init -input=false -backend-config="backend/${{ inputs.environment }}.hcl"
      - name: Select pre-existing environment workspace
        run: terraform workspace select "${{ inputs.environment }}"
      - name: Create a read-only change plan
        run: terraform plan -input=false -lock-timeout=5m -var-file="envs/${{ inputs.environment }}.tfvars"
