apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-stable
  namespace: aegisvolt
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
  selector:
    matchLabels: { app: gateway, track: stable }
  template:
    metadata:
      labels: { app: gateway, track: stable }
    spec:
      containers:
        - name: gateway
          image: aegisvolt/gateway:latest
          ports: [{containerPort: 8000}]
          livenessProbe:
            httpGet: {path: /health, port: 8000}
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet: {path: /health, port: 8000}
            periodSeconds: 5
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-canary
  namespace: aegisvolt
spec:
  replicas: 1
  selector:
    matchLabels: { app: gateway, track: canary }
  template:
    metadata:
      labels: { app: gateway, track: canary }
    spec:
      containers:
        - name: gateway
          image: aegisvolt/gateway:canary
          ports: [{containerPort: 8000}]
          livenessProbe:
            httpGet: {path: /health, port: 8000}
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: aegisvolt
spec:
  selector: { app: gateway }
  ports: [{port: 80, targetPort: 8000}]
