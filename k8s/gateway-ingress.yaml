apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gateway-private
  namespace: aegisvolt
  annotations:
    alb.ingress.kubernetes.io/scheme: internal
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80}]'
    alb.ingress.kubernetes.io/healthcheck-path: /health
    alb.ingress.kubernetes.io/inbound-cidrs: 10.0.0.0/16
    alb.ingress.kubernetes.io/load-balancer-name: aegisvolt-graphql
    # Weighted forward used by scripts/canary_deploy.py (stable/canary %).
    alb.ingress.kubernetes.io/actions.graphql-weighted: >-
      {"type":"forward","forwardConfig":{"targetGroups":[
      {"serviceName":"gateway","servicePort":"80","weight":100},
      {"serviceName":"gateway-canary","servicePort":"80","weight":0}]}}
    alb.ingress.kubernetes.io/healthcheck-protocol: HTTP
spec:
  ingressClassName: alb
  rules:
    - http:
        paths:
          - path: /graphql
            pathType: Prefix
            backend:
              service:
                name: graphql-weighted
                port:
                  name: use-annotation
