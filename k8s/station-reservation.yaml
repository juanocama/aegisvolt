apiVersion: apps/v1
kind: Deployment
metadata:
  name: station-reservation
  namespace: aegisvolt
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: station-reservation
  template:
    metadata:
      labels:
        app: station-reservation
    spec:
      serviceAccountName: station-reservation
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: station-reservation
          image: aegisvolt-station-reservation:CHANGE_ME_TAG
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8001
              protocol: TCP
          env:
            - name: ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: aegisvolt-config
                  key: ENVIRONMENT
            - name: AWS_DEFAULT_REGION
              valueFrom:
                configMapKeyRef:
                  name: aegisvolt-config
                  key: AWS_DEFAULT_REGION
            - name: TABLE_NAME
              value: aegisvolt-dev-stations
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
          startupProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: station-reservation
  namespace: aegisvolt
spec:
  type: ClusterIP
  selector:
    app: station-reservation
  ports:
    - name: http
      port: 8001
      targetPort: http
