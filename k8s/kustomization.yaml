apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: aegisvolt
resources:
  - namespace.yaml
  - configmap.yaml
  - serviceaccounts.yaml
  - gateway-deployment.yaml
  - gateway-service.yaml
  - gateway-ingress.yaml
  - station-reservation.yaml
  - billing-wallet.yaml
  - energy-dispatch.yaml
  - frontend.yaml
images:
  - name: aegisvolt-frontend
    newName: CHANGE_ME_ECR_ACCOUNT.dkr.ecr.CHANGE_ME_AWS_REGION.amazonaws.com/aegisvolt/dev/frontend
    newTag: CHANGE_ME_TAG
  - name: aegisvolt-gateway
    newName: CHANGE_ME_ECR_ACCOUNT.dkr.ecr.CHANGE_ME_AWS_REGION.amazonaws.com/aegisvolt/dev/gateway
    newTag: CHANGE_ME_TAG
  - name: aegisvolt-station-reservation
    newName: CHANGE_ME_ECR_ACCOUNT.dkr.ecr.CHANGE_ME_AWS_REGION.amazonaws.com/aegisvolt/dev/station-reservation
    newTag: CHANGE_ME_TAG
  - name: aegisvolt-billing-wallet
    newName: CHANGE_ME_ECR_ACCOUNT.dkr.ecr.CHANGE_ME_AWS_REGION.amazonaws.com/aegisvolt/dev/billing-wallet
    newTag: CHANGE_ME_TAG
  - name: aegisvolt-energy-dispatch
    newName: CHANGE_ME_ECR_ACCOUNT.dkr.ecr.CHANGE_ME_AWS_REGION.amazonaws.com/aegisvolt/dev/energy-dispatch
    newTag: CHANGE_ME_TAG
