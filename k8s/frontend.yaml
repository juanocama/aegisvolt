apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-config
  namespace: aegisvolt
data:
  # Private API Gateway host (resolves to the execute-api VPC endpoint) and
  # stage path. Overlays/deploy tooling must replace these; nginx refuses to
  # start while they are unset, and the CHANGE_ME host never resolves.
  GRAPHQL_UPSTREAM_HOST: CHANGE_ME_API_ID.execute-api.CHANGE_ME_AWS_REGION.amazonaws.com
  GRAPHQL_UPSTREAM_PATH: /CHANGE_ME_STAGE/graphql
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: aegisvolt
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: frontend
          image: aegisvolt-frontend:CHANGE_ME_TAG
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: frontend-config
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 101
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: conf
              mountPath: /etc/nginx/conf.d
      volumes:
        - name: tmp
          emptyDir: {}
        - name: conf
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: aegisvolt
spec:
  type: ClusterIP
  selector:
    app: frontend
  ports:
    - name: http
      port: 80
      targetPort: http
---
# Dedicated internal ALB for the SPA (separate from the GraphQL ALB).
# Reachable only from inside the VPC (VPN / Session Manager port forwarding).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: frontend-private
  namespace: aegisvolt
  annotations:
    alb.ingress.kubernetes.io/scheme: internal
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80}]'
    alb.ingress.kubernetes.io/inbound-cidrs: 10.0.0.0/16
    alb.ingress.kubernetes.io/healthcheck-path: /healthz
    alb.ingress.kubernetes.io/load-balancer-name: aegisvolt-frontend
spec:
  ingressClassName: alb
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
