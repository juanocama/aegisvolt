# Canary track of the GraphQL gateway. The ALB splits traffic between the
# `gateway` and `gateway-canary` target groups by weight (gateway-ingress.yaml).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-canary
  namespace: aegisvolt
spec:
  # Scaled 0 -> 1 only during a canary rollout (scripts/canary_deploy.py).
  replicas: 0
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: gateway-canary
  template:
    metadata:
      labels:
        app: gateway-canary
        track: canary
    spec:
      serviceAccountName: gateway
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gateway
          image: aegisvolt-gateway:CHANGE_ME_TAG
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: aegisvolt-config
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: gateway-canary
  namespace: aegisvolt
spec:
  type: ClusterIP
  selector:
    app: gateway-canary
  ports:
    - name: http
      port: 80
      targetPort: http
