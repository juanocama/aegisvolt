apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aegisvolt-canary
  namespace: aegisvolt
  annotations:
    nginx.ingress.kubernetes.io/canary: "true"
    nginx.ingress.kubernetes.io/canary-weight: "10"
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: {name: gateway, port: {number: 80}}
